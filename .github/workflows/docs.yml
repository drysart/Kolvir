name: Docs

# The guide is built rather than checked in: the control reference is generated from the library's XML
# documentation, the navigation is translated from docs/nav.yml, and the HTML comes out of the pinned
# generator in .config/dotnet-tools.json. So this job is the only thing that proves the docs build at
# all, and it runs on the same generator every developer runs locally.
#
# It builds on Linux on purpose. That is where a relative link whose case does not match the file on
# disk stops working, and the generator treats a broken link or a missing image as an error.
#
# Nothing is deployed. Publishing the built site (a gh-pages branch, with /latest/ and one directory
# per release tag) needs Pages enabled and a decision about where it lives; see dev-docs/DOCS-PLAN.md.

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/docs.yml'
      - '.config/dotnet-tools.json'
      - 'docs/**'
      - 'src/tools/**'
      - 'src/core/Kolvir/**'
      - 'src/demo/Kolvir.Demo.App/DemoUi.cs'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build the guide
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tool's own project is restored first, so a restore failure reads as one rather than as a
      # confusing build failure later.
      - name: Restore the docs tool
        run: dotnet restore src/tools/Kolvir.Docs/Kolvir.Docs.csproj --nologo

      # The snippets are the code the getting-started and concepts pages show. Nothing references
      # this project; it exists to be compiled, and the docs build then checks that every C# block on
      # those pages appears in it verbatim.
      - name: Build the snippets
        run: dotnet build src/tools/Kolvir.Docs.Snippets/Kolvir.Docs.Snippets.csproj --nologo

      # One command: build the library for its XML documentation, generate the control reference,
      # translate nav.yml, check the tree, and run the generator. `pipefail` is what makes a failing
      # build fail the step, since the pipeline's exit status is tee's otherwise.
      - name: Build the guide
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/tools/Kolvir.Docs -- build 2>&1 | tee "$RUNNER_TEMP/docs.log"

      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Docs diagnostics'
            echo '```'
            grep -E '^(error|warning|.*error:)' "$RUNNER_TEMP/docs.log" | head -n 40 || true
            echo '```'
            echo '### Environment'
            echo '```'
            dotnet --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The built HTML is the artifact: it is what a reviewer needs to read the page, and it is what
      # a publication job would push somewhere once there is somewhere to push it.
      - name: Upload the built guide
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_site
          if-no-files-found: error
