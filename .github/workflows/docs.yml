name: Docs

# The guide is built rather than checked in: the control reference is generated from the library's XML
# documentation, the navigation is translated from docs/nav.yml, and the HTML comes out of the pinned
# generator in .config/dotnet-tools.json. So this job is the only thing that proves the docs build at
# all, and it runs on the same generator every developer runs locally.
#
# It builds on Linux on purpose. That is where a relative link whose case does not match the file on
# disk stops working, and the generator treats a broken link or a missing image as an error.
#
# Pull requests build it and stop there. A push to develop also publishes it to GitHub Pages, under
# /latest/ with the site root redirecting into it, so a per-release directory can be added beside it
# without moving anything. Pages can only be deployed from an artifact, and a deployment replaces the
# whole site rather than adding to it, so a tag directory is only worth adding once the job builds
# `latest/` and every tag into one artifact; see dev-docs/DOCS-PLAN.md.

on:
  pull_request:
    branches: [develop]
    paths: &docs-paths
      - '.github/workflows/docs.yml'
      - '.config/dotnet-tools.json'
      - 'docs/**'
      - 'src/tools/**'
      - 'src/core/Kolvir/**'
      - 'src/demo/Kolvir.Demo.App/DemoUi.cs'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
  push:
    branches: [develop]
    paths: *docs-paths
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build the guide
    runs-on: ubuntu-latest
    # Superseded pull request builds are worth cancelling. A push to develop is not: cancelling it
    # would drop a publication, so only the pull request case cancels.
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tool's own project is restored first, so a restore failure reads as one rather than as a
      # confusing build failure later.
      - name: Restore the docs tool
        run: dotnet restore src/tools/Kolvir.Docs/Kolvir.Docs.csproj --nologo

      # The snippets are the code the getting-started and concepts pages show. Nothing references
      # this project; it exists to be compiled, and the docs build then checks that every C# block on
      # those pages appears in it verbatim.
      - name: Build the snippets
        run: dotnet build src/tools/Kolvir.Docs.Snippets/Kolvir.Docs.Snippets.csproj --nologo

      # One command: build the library for its XML documentation, generate the control reference,
      # translate nav.yml, check the tree, and run the generator. `pipefail` is what makes a failing
      # build fail the step, since the pipeline's exit status is tee's otherwise.
      - name: Build the guide
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/tools/Kolvir.Docs -- build 2>&1 | tee "$RUNNER_TEMP/docs.log"

      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Docs diagnostics'
            echo '```'
            grep -E '^(error|warning|.*error:)' "$RUNNER_TEMP/docs.log" | head -n 40 || true
            echo '```'
            echo '### Environment'
            echo '```'
            dotnet --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The built HTML is the artifact: it is what a reviewer needs to read the page, and it is what
      # the publication job below deploys.
      - name: Upload the built guide
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_site
          if-no-files-found: error

  deploy:
    name: Publish the guide
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      # Only so the first step can delete this run's stale `github-pages` artifacts; without that the
      # job cannot be rerun at all. See that step.
      actions: write
    environment:
      name: github-pages
      # Whichever attempt actually deployed. Every attempt that did not run, or that failed, leaves
      # its `page_url` output empty, and `||` takes the first operand that is not, so this resolves
      # to the one attempt that succeeded. When all attempts fail this resolves to the empty string
      # and the environment is recorded without a URL, which is what a single failed deploy did
      # before the retries existed; the job is red in that case anyway.
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deploy_retry_2.outputs.page_url }}
    # Publications queue instead of cancelling each other: a deployment that is interrupted leaves the
    # site on whichever version happened to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # `upload-pages-artifact` runs in this job, so every attempt of this job uploads one more
      # artifact named "github-pages" into the same run, and `deploy-pages` deploys only when exactly
      # one exists. Attempt 1 of run 45447073038 failed, and attempts 2 and 3 - reruns of that job -
      # failed with "Multiple artifacts named github-pages were unexpectedly found for this workflow
      # run. Artifact count is 3", because each rerun added its own artifact on top of the previous
      # ones. That made the job structurally un-rerunnable: a rerun could never succeed, so one
      # transient failure left the run permanently red and the only recovery was a whole new run
      # (45463995769). Deleting this run's github-pages artifacts first means a rerun starts from
      # zero, which is what makes rerunning this job a safe thing to do during an incident.
      - name: Delete github-pages artifacts left by an earlier attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            while read -r id; do
              echo "deleting the github-pages artifact $id left by an earlier attempt"
              gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
            done
          echo "run $RUN_ID holds no github-pages artifact now"

      # The site is published a directory below its root so a per-release directory can sit beside it
      # later, and the root becomes a redirect into it. Every link in the built HTML is relative, so
      # the guide works unchanged at that depth.
      - name: Lay the site out under latest/
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/latest

      - name: Redirect the site root into latest/
        run: printf '<meta http-equiv="refresh" content="0; url=latest/">\n' > site/index.html

      - name: Read the Pages configuration
        uses: actions/configure-pages@v5

      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # This step waits for an artifact named github-pages to appear in this run's listing, requires
      # that there is exactly one, and confirms that the artifact's own metadata URL answers. What
      # that buys is an early, legible message for the two bad states this job can create for
      # itself: no artifact at all (the packaging step failed, so there is nothing to deploy) and a
      # duplicate (a leftover that the cleanup step above should have deleted, which deploy-pages
      # would otherwise refuse deep inside itself as "Multiple artifacts named github-pages were
      # unexpectedly found"). It also fails rather than warning and deploying anyway, so a run can
      # never publish something other than what this attempt built.
      #
      # What it does not buy is protection against the artifacts API itself being inconsistent. It
      # was written after run 45447073038, and the comment here used to claim that it polls the
      # same call deploy-pages fails on and so prevents that failure. Run 46180065852 disproved
      # that. In that job this step listed the run's artifacts at 19:14:53.81, found artifact
      # 15276369627, fetched its metadata URL and exited 0 at 19:14:54.394. At 19:14:54.736
      # deploy-pages listed the same endpoint and printed "Found 1 artifact(s)", and at 19:14:54.929
      # its metadata call failed with "No artifacts named github-pages were found". The artifact
      # was finalized (8,651,390 bytes) and was still there afterwards. So a successful listing says
      # nothing about the next listing of the same endpoint 0.9 seconds later. The deploy retries
      # below, not this step, are what covers that.
      - name: Wait for the packaged site to be readable through the artifacts API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            mapfile -t ids < <(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
              2>/dev/null || true)
            if [ "${#ids[@]}" -gt 1 ]; then
              echo "::error::expected exactly one github-pages artifact in run $RUN_ID but found ${#ids[@]} (${ids[*]}), so deploy-pages would refuse this run; the cleanup step should have left none, so this means this attempt uploaded twice"
              exit 1
            fi
            if [ "${#ids[@]}" -eq 1 ] && \
               gh api "repos/$REPO/actions/artifacts/${ids[0]}" --jq .id >/dev/null 2>&1; then
              echo "the github-pages artifact ${ids[0]} is readable after $attempt attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the github-pages artifact never became readable through the artifacts API; failing here rather than deploying whatever else the API happened to return. Note this proves nothing about whether the next listing will contain it - that is what the deployment retries below are for"
          exit 1

      # deploy-pages does not retry anything itself, so a single transient artifacts API blip turns
      # a green run red permanently. Run 46180065852 is exactly that: 0.9 seconds after the wait step
      # above read the artifact successfully, the very same action could not see it, and the run was
      # red for a publication that was complete and correct. So the deployment is attempted three
      # times.
      #
      # Only the deployment is repeated. The packaging happens once, above, and every attempt
      # deploys that same artifact, so the attempts cannot manufacture the duplicate artifact that
      # deploy-pages refuses; the cleanup and wait steps stay single, for the same reason.
      #
      # On deployment state: an attempt that fails *before* creating a Pages deployment - which
      # includes the artifacts API failure being retried here, since the artifact lookup comes first
      # - leaves nothing behind. An attempt that fails *after* `POST /pages/deployments` can leave a
      # deployment record, but deploy-pages cancels its own deployment on the timeout and
      # error-count paths that can end that way, and a cancel is a further API call that need not
      # have landed by the time the next attempt starts. So a retry refused with "deployment already
      # in progress" is possible in principle, though not from the failure above. The increasing
      # gap before each attempt is the handling: the refused attempt fails, and the next one, later,
      # succeeds once the cancel drains. That is deliberately not an explicit cancel-the-deployment
      # step - adding one would mean guessing at state the action already cleans up.
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 10

      - name: Deploy to Pages (attempt 2)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before the last deployment attempt
        if: steps.deploy_retry.outcome == 'failure'
        run: sleep 20

      - name: Deploy to Pages (attempt 3)
        id: deploy_retry_2
        if: steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Every attempt is `continue-on-error`, so without this a run where all three failed would go
      # green with nothing published. It runs only when all three outcomes are failures.
      - name: Fail when every deployment attempt failed
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure' && steps.deploy_retry_2.outcome == 'failure'
        run: |
          echo "::error::all 3 deploy-pages attempts failed for run ${{ github.run_id }}; each attempt deploys the same packaged artifact, so this is not one transient artifacts API blip. Check githubstatus.com and the attempts above before rerunning this job"
          exit 1
