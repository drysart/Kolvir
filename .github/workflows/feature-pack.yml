name: Feature pack

# A rung-3 feature multi-targets every platform it supports, so building one in full needs the macOS
# workload, the Windows reference pack and the base SDK in the same place. macOS is the only platform
# that can supply the macOS workload, and EnableWindowsTargeting brings the Windows reference pack to
# it, so a single macOS job produces the whole package: every lib/ folder and every dependency group
# comes out of one `dotnet pack` (FEATURE-COST-POLICY.md section 4). That is the point of the job - a
# feature author writes one multi-targeting project and never arranges a three-platform build.
#
# It packs and inspects; it does not publish. Publishing needs a feed and a version, which is a
# release decision rather than a pull request one.
#
# Like the macOS build, this runs on a pull request against develop and on demand, not on every push:
# feature work in progress is packed on whichever machine the author has, and the only thing a runner
# adds is the check that the package is complete.

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/feature-pack.yml'
      - '.github/scripts/check-feature-package.py'
      - 'Kolvir.Feature.*/**'
      - 'Kolvir/**'
      - 'Kolvir.Backend.*/**'
  workflow_dispatch:

concurrency:
  group: feature-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Pack every feature package
    # The same image the macOS build uses, because the macOS workload here has to be the one the
    # feature's macos inner build targets.
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the macOS workload
        run: dotnet workload install macos

      - name: Find the feature projects
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Feature projects live at the repository root. The development solution lists them, but
          # this job is what builds all three frameworks of each and packs the result.
          projects=(Kolvir.Feature.*/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::No Kolvir.Feature.*/*.csproj in this tree, so there is nothing to pack."
            exit 1
          fi
          printf '%s\n' "${projects[@]}" | tee "$RUNNER_TEMP/projects.txt"
          {
            echo '### Feature projects'
            echo '```'
            printf '%s\n' "${projects[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          while IFS= read -r project; do
            name="$(basename "$project" .csproj)"
            # EnableWindowsTargeting is what lets the net10.0-windows inner build run on macOS;
            # without it the SDK stops with NETSDK1100. Nothing else is overridden: the package
            # carries assemblies, so the trimmer and AOT settings do not apply to it.
            dotnet pack "$project" -c Release --nologo \
              -p:EnableWindowsTargeting=true \
              -p:PackageOutputPath="$RUNNER_TEMP/packages" \
              2>&1 | tee "$RUNNER_TEMP/pack-$name.log"
          done < "$RUNNER_TEMP/projects.txt"
          ls -l "$RUNNER_TEMP/packages"

      # A missing lib/ folder or dependency group is silent at every other stage: NuGet falls back
      # to the net10.0 one and the application ships another platform's assembly. The check opens
      # each package and compares the two lists, so the failure happens here instead of in a user's
      # application. See FEATURE-COST-POLICY.md section 4.
      - name: Check every package's layout
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No package was produced."
            exit 1
          fi
          python3 .github/scripts/check-feature-package.py "${packages[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarise pack errors
        if: failure()
        run: |
          set -euo pipefail
          grep -hE ': (error|warning) [A-Z]+[0-9]+' "$RUNNER_TEMP"/pack-*.log 2>/dev/null \
            | head -n 25 > errors.txt || true
          if [ ! -s errors.txt ]; then
            tail -n 20 "$RUNNER_TEMP"/pack-*.log > errors.txt 2>/dev/null || true
          fi
          {
            echo '### Pack diagnostics'
            echo '```'
            cat errors.txt
            echo '```'
            echo '### Environment'
            echo '```'
            dotnet --version
            dotnet workload list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          head -n 10 errors.txt | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: feature-packages
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error
