name: Tests

# Every suite is a portable net10.0 assembly, or the AppKit backend's net10.0-macos one, and none of
# them needs a window server or a display: the tests drive Kolvir through the headless backend, the
# animation suite drives its own clock and frame source rather than a real timer, the image suites
# drive their timelines with a hand-advanced TimeProvider, the generator suite compiles a source
# string in memory rather than building anything at all, and the AppKit suite stays on the
# AppKit-free side of that backend for exactly this reason. The matrix is the point rather than a
# formality - the same tests run on all three platforms, which is what keeps the portable claims
# honest, and a control that only behaves on one of them fails here.
#
# What differs per platform is what gets *compiled* beside the suites. A feature package builds for the
# platform the job is on plus the portable framework, from KolvirTargetFrameworks in
# Directory.Build.props, so the Windows job compiles the Win32 inner builds and the macOS job compiles
# AppKit and the net10.0-macos ones. That is real coverage rather than a side effect: a macos-only
# compile error used to surface nowhere but the packaging job. It is also why the macOS leg installs
# the macOS workload and Linux needs nothing at all.
#
# It runs on a pull request against develop and on demand. Pushes are deliberately not a trigger:
# work in progress is built and tested locally,
# where a run takes seconds, so a runner spinning up on every push to a feature branch only adds
# latency. A merge to develop does not need a rebuild either - the pull request that produced it
# already ran the same tests. Use workflow_dispatch to verify a branch that has no pull request.

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/tests.yml'
      - 'src/core/**'
      - 'src/backends/**'
      - 'src/features/**'
      - 'src/generators/**'
      - 'tests/**'
      - 'src/demo/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite is deterministic by construction - a hand-driven clock, one embedded font, no network -
  # so a rerun should not change the result, and a flaky run is a bug to fix rather than a retry.
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    # A platform that fails should not hide the other two: three results say whether a break is
    # portable or platform-specific.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The feature packages build for the platform the job is on, so the macOS leg compiles the
      # net10.0-macos inner builds and the AppKit backend behind them, and that needs the macOS
      # workload. The packaging job installs the same one for the same reason.
      - name: Install the macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      # Restoring the test projects restores the library, the headless backend and the feature with
      # them. It is a separate step so a restore failure is distinguishable from a test failure in
      # the log. Each test project is restored on its own rather than the whole solution: the
      # solution lists every platform's backend and a runner has only its own.
      #
      # No leg narrows anything by hand. A feature builds for the platform the job is on plus the
      # portable framework (KolvirTargetFrameworks, in Directory.Build.props), so restoring a net10.0
      # test project resolves that feature's net10.0 inner build and never walks into another
      # platform's. That is what used to fail as NETSDK1147 on every runner, when each feature listed
      # all three frameworks and every restore followed all three into the backends behind them.
      - name: Restore
        run: |
          dotnet restore tests/core/Kolvir.Tests/Kolvir.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.DragDrop.Tests/Kolvir.Feature.DragDrop.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.Animations.Tests/Kolvir.Feature.Animations.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.Svg.Tests/Kolvir.Feature.Svg.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.AnimatedGif.Tests/Kolvir.Feature.AnimatedGif.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.AnimatedWebp.Tests/Kolvir.Feature.AnimatedWebp.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.AssetLoading.Tests/Kolvir.Feature.AssetLoading.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.AssetLoading.Http.Tests/Kolvir.Feature.AssetLoading.Http.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.Badges.Tests/Kolvir.Feature.Badges.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.WoffFonts.Tests/Kolvir.Feature.WoffFonts.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.VirtualDom.Tests/Kolvir.Feature.VirtualDom.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.Observables.Tests/Kolvir.Feature.Observables.Tests.csproj --nologo
          dotnet restore tests/features/Kolvir.Feature.EffectiveInView.Tests/Kolvir.Feature.EffectiveInView.Tests.csproj --nologo
          dotnet restore tests/generators/Kolvir.Feature.VirtualDom.Generators.Tests/Kolvir.Feature.VirtualDom.Generators.Tests.csproj --nologo
          dotnet restore tests/generators/Kolvir.Analyzers.Tests/Kolvir.Analyzers.Tests.csproj --nologo
          dotnet restore tests/demo/Kolvir.Demo.App.Tests/Kolvir.Demo.App.Tests.csproj --nologo

      # The filter is the category contract: a test that can only run on one platform carries
      # Platform.Win32, Platform.AppKit or Platform.Gtk4 and the portable job skips it. Everything
      # the matrix runs is Core, Headless, Pixels or a feature's own category. Keep this expression
      # identical to the one in the README so a local run matches CI.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/core/Kolvir.Tests/Kolvir.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=tests.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --collect:"Kolvir Code Coverage" \
            --blame-hang-timeout 5m 2>&1 | tee "$RUNNER_TEMP/test.log"

      # The feature suite is a second assembly because a rung-3 feature is a package of its own: an
      # application that never calls AddDragDrop() ships none of it, so it gets its own tests rather
      # than a folder inside the core suite. It runs under the same category filter, so a
      # platform-only test opts out the same way there. `tee -a` keeps both runs in one log, which
      # is what the failure summary below reads.
      - name: Test the drag and drop feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.DragDrop.Tests/Kolvir.Feature.DragDrop.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=dragdrop.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The animations feature's suite, wired the same way and for the same reasons: its own
      # assembly, the same category filter. Every animation in it is driven by a hand-advanced clock
      # and a frame source the test fires, so this leg is as deterministic as the other two and needs
      # no display.
      - name: Test the animations feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.Animations.Tests/Kolvir.Feature.Animations.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=animations.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The asset loading feature's suite. Same wiring again, and the same reason for a leg of its
      # own: a rung-3 package's tests live with the package. Everything in it is hand-driven - the
      # fake loader's gate is a field the test sets, its task is one the test completes, and its
      # handler pair is a list - so nothing here waits, sleeps or depends on a clock, and no display
      # is involved. What it pins is the queue's contract: the order the walk uses, what a closed
      # gate does and does not stop, the re-entrancy a synchronous completion causes, and the two
      # cancellation paths.
      - name: Test the asset loading feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.AssetLoading.Tests/Kolvir.Feature.AssetLoading.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=assetloading.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The HTTP loader's suite, in its own assembly for the same reason the loader is its own
      # package. There is no network and no socket: a fake HttpMessageHandler is the transport, which
      # is why an application-supplied handler is part of the public options rather than a test hook.
      # Nothing sleeps - a request that must start is observed through the transport's own signal, and
      # a response is completed by hand - so what it pins is the two limits, the runtime changes that
      # admit queued work, the shared fetch, and the cancellation that aborts it only when the last
      # handle leaves.
      - name: Test the HTTP asset loading feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.AssetLoading.Http.Tests/Kolvir.Feature.AssetLoading.Http.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=assetloading.http.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The SVG feature's suite. Same wiring again. Everything in it renders to an SKPicture
      # offscreen and reads pixels
      # back, so no display is involved; the security cases (an external reference, a script, an
      # entity bomb) are documents that must be refused, which is as headless as a test gets.
      - name: Test the SVG feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.Svg.Tests/Kolvir.Feature.Svg.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=svg.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The animated GIF feature's suite. Same wiring. It decodes and composites
      # frames in memory and reads pixels back, and every position it asserts comes from a clock the
      # test advances by hand, so it needs no display and no timer of its own.
      - name: Test the animated GIF feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.AnimatedGif.Tests/Kolvir.Feature.AnimatedGif.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=gif.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The animated WebP feature's suite. Same wiring. It builds RIFF containers
      # and decodes their frames in memory, ignores the run-time clock entirely and reads pixels back,
      # so no display and no timer are involved.
      - name: Test the animated WebP feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.AnimatedWebp.Tests/Kolvir.Feature.AnimatedWebp.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=webp.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The app badge feature's portable half. Same wiring. It exercises the
      # resolution of Count, Text, IsDot and Urgent into one presentation, and the degradation an
      # unsupported presentation gets, so it needs neither a window nor a desktop.
      - name: Test the app badge feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.Badges.Tests/Kolvir.Feature.Badges.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=badges.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The WOFF feature's suite. Same wiring. It unwraps real WOFF and WOFF 2
      # files - IBM Plex Sans, OFL, the same release as the face the sample carries - and compares the
      # glyphs they draw with the glyphs the plain .ttf draws, pixel for pixel through Skia. That is
      # as headless as a test gets: no window, no display, and nothing the machine has installed can
      # affect the answer.
      - name: Test the WOFF feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.WoffFonts.Tests/Kolvir.Feature.WoffFonts.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=woff.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # Reconciling a tree is comparison and assignment over controls, driven entirely through the
      # headless backend: no native window, no display, so this is as portable as the core suite.
      # The generator is wired in as an analyzer, so this leg also builds the emitted node classes and
      # runs the analyzer over them, which makes it the end-to-end check of both halves.
      #
      # Nothing narrows the feature here: it builds for this platform plus the portable framework, and
      # the test project is portable, so restore resolves the net10.0 inner build of the feature, of
      # the observables package behind it and of nothing else.
      - name: Test the virtual DOM feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.VirtualDom.Tests/Kolvir.Feature.VirtualDom.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=virtualdom.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The generator's own suite. It builds no windows at all - it compiles a source string, runs the
      # generator over it and then runs the analyzer over the result - so it is the cheapest leg here
      # and also the one that pins what a manifest becomes and what a broken one reports. It references
      # the feature project for the metadata a test compilation is compiled against, which narrows the
      # same way the leg above does.
      - name: Test the virtual DOM generator
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/generators/Kolvir.Feature.VirtualDom.Generators.Tests/Kolvir.Feature.VirtualDom.Generators.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=virtualdom-generator.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      - name: Test the union analyzers
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/generators/Kolvir.Analyzers.Tests/Kolvir.Analyzers.Tests.csproj --no-restore --nologo \
            --logger "trx;LogFileName=analyzers.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The observables feature's suite. Smallest leg in the workflow, and the only one that asserts
      # something with no window, no frame and no control anywhere near it: the package deliberately
      # references nothing from Kolvir, which is what makes it usable in a console host or a server
      # process as much as in a UI. Nothing here draws anything, and nothing narrows it.
      - name: Test the observables feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.Observables.Tests/Kolvir.Feature.Observables.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=observables.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The effective-in-view feature's suite. Same wiring again, and the most portable leg of the lot:
      # every case is a real headless window, a layout pass and a rectangle, and the occlusion cases
      # print nothing and need no display. It tests the feature, and through it the public seam the
      # core library added for it - the completed-layout notification.
      - name: Test the effective in view feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.EffectiveInView.Tests/Kolvir.Feature.EffectiveInView.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=effectiveinview.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The sample's one testable unit. The rich-label markup page is judged by rendering it, but the
      # parser behind it runs on every keystroke and is a pure function, so it is a test rather than a
      # screenshot. The project links the source file instead of referencing the application: the
      # sample is a platform application with a conditioned target framework, and no package or
      # library is involved in this file at all, so this leg restores nothing but the test framework.
      - name: Test the sample's markup parser
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/demo/Kolvir.Demo.App.Tests/Kolvir.Demo.App.Tests.csproj --no-restore --nologo \
            --logger "trx;LogFileName=demo-markup.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The Win32 backend's own suite targets net10.0-windows and exists only on the Windows leg.
      # It covers the internal GL fallback decision with a fake probe; the accelerated path itself
      # needs a real driver, which no hosted runner has, so that half is verified by hand and
      # documented in the README rather than asserted here.
      - name: Restore the Win32 backend tests
        if: runner.os == 'Windows'
        run: dotnet restore tests/backends/Kolvir.Backend.Win32.Tests/Kolvir.Backend.Win32.Tests.csproj --nologo

      - name: Test the Win32 backend
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/backends/Kolvir.Backend.Win32.Tests/Kolvir.Backend.Win32.Tests.csproj --no-restore --nologo \
            --logger "trx;LogFileName=win32.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The AppKit backend's own suite is macOS-only, and it is the one platform suite that needs a
      # macOS SDK feature beyond the workload: the test host is an app bundle, so the project names
      # an ApplicationId and a RuntimeIdentifier for itself (see its csproj). It creates no NSView -
      # AppKit only builds its objects on the process's main thread and a test runs on a pool thread
      # - so it needs no window server and cannot fail a runner for that reason. The view-level half
      # is tests/backends/Kolvir.Backend.AppKit.Harness, a console program run by hand on the Mac
      # host, because it does need a view and therefore a main thread.
      - name: Restore the AppKit backend tests
        if: runner.os == 'macOS'
        run: dotnet restore tests/backends/Kolvir.Backend.AppKit.Tests/Kolvir.Backend.AppKit.Tests.csproj --nologo

      - name: Test the AppKit backend
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/backends/Kolvir.Backend.AppKit.Tests/Kolvir.Backend.AppKit.Tests.csproj --no-restore --nologo \
            --logger "trx;LogFileName=appkit.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The badge feature's Windows half: the overlay icon is drawn with Skia and handed to the
      # shell as a GDI icon, so its geometry is asserted pixel by pixel and cannot be checked from
      # the portable suite. Windows only, like the backend suite above - and on Windows the feature
      # already builds its net10.0-windows inner build, so a net10.0-windows test project binds it
      # with nothing passed in.
      - name: Restore the Windows badge tests
        if: runner.os == 'Windows'
        run: dotnet restore tests/features/Kolvir.Feature.Badges.Tests.Windows/Kolvir.Feature.Badges.Tests.Windows.csproj --nologo

      - name: Test the Windows badge icon
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/features/Kolvir.Feature.Badges.Tests.Windows/Kolvir.Feature.Badges.Tests.Windows.csproj --no-restore --nologo \
            --logger "trx;LogFileName=badges-win32.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The publish no test would ever exercise, and therefore the one that broke twice: a Visual
      # Studio Publish (and any solution-wide `dotnet publish`) passes the properties that shape the
      # output as *global* properties, and a global reaches every project in the reference graph
      # rather than only the one being published. That broke the netstandard2.0 union analyzer, which
      # cannot be trimmed (NETSDK1124), and the child `dotnet build` that produces the virtual DOM
      # generator, which inherits `Platform` from this environment and writes to a platform folder the
      # `<Analyzer>` item does not name (CS0006). Both are silent in a build and loud only here, so
      # this is the guard: the same command a Publish click produces, with the generator's output
      # deleted first so no pre-existing copy can mask the second failure.
      #
      # The plain `dotnet build` first is not a warm-up. Every other command in this workflow passes
      # `-c`, and that is exactly the global that hid a contract depending on `Configuration`: MSBuild
      # expands a property reference where it is assigned, so a plain build - which passes no
      # configuration at all - saw an empty one, and the child build was invoked as `-c` with nothing
      # after it. Two builds, one with no properties and one with the publish's, keep both readings
      # honest, and they are cheap next to the publish.
      #
      # `vcvars64.bat` is what puts the linker on the path - NativeAOT cannot link without it - and it
      # is found through vswhere so this pins no edition or version. Only the generator's bin and obj
      # are cleared: re-restoring every project would add time without testing anything this step is
      # about, since `dotnet publish` restores what it needs anyway.
      #
      # One warning is expected and is not this step's business: IL2104 on `SharpGen.Runtime`, which
      # arrives with Vortice and predates everything here. Warnings do not fail a publish, and nothing
      # below turns them into errors - `-p:TrimmerSingleWarn=false` would bury the log in the
      # individual cases behind that summary, so it is deliberately left at its default.
      - name: Publish the demo with NativeAOT as Visual Studio does
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo Could not find a Visual Studio with the C++ toolset; native linking needs one.
            exit /b 1
          )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1

          if exist src\generators\Kolvir.Feature.VirtualDom.Generators\bin rmdir /s /q src\generators\Kolvir.Feature.VirtualDom.Generators\bin
          if exist src\generators\Kolvir.Feature.VirtualDom.Generators\obj rmdir /s /q src\generators\Kolvir.Feature.VirtualDom.Generators\obj

          rem Nothing on the command line but the project: no -c, no -p. This is the ordinary build,
          rem and it must work before the publish does.
          dotnet build src\demo\Kolvir.Demo.App\Kolvir.Demo.App.csproj
          if errorlevel 1 exit /b 1
          dotnet build src\demo\Kolvir.Demo.VirtualDom\Kolvir.Demo.VirtualDom.csproj
          if errorlevel 1 exit /b 1

          dotnet publish src\demo\Kolvir.Demo.App\Kolvir.Demo.App.csproj -c Release -p:Platform=AnyCPU ^
            -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=full -p:SelfContained=true ^
            -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=false
          if errorlevel 1 exit /b 1

          rem A native image is tens of megabytes; the apphost this would fall back to if AOT quietly
          rem stopped happening is a few hundred kilobytes, so a size check separates the two.
          set "EXE=src\demo\Kolvir.Demo.App\bin\Release\net10.0-windows\win-x64\publish\KolvirDemoApp.exe"
          if not exist "%EXE%" (
            echo The publish produced no KolvirDemoApp.exe under publish\.
            exit /b 1
          )
          for %%F in ("%EXE%") do set "EXE_BYTES=%%~zF"
          if %EXE_BYTES% LSS 1000000 (
            echo KolvirDemoApp.exe is %EXE_BYTES% bytes, which is an apphost rather than a native image.
            exit /b 1
          )
          echo KolvirDemoApp.exe is %EXE_BYTES% bytes of native code.

      # The virtual DOM sample's --check is the test a test project cannot be: it mounts the real
      # application, drives the real controls through the headless backend, and asserts what the nodes
      # described - including the cell positions an extension property set and the handler an
      # extension method pair attached. It throws on the first disagreement, so a regression in the
      # reconciler's patch path fails the job instead of needing an eye on a demo window.
      - name: Run the virtual DOM sample's check
        if: runner.os == 'Windows'
        run: dotnet run --project src\demo\Kolvir.Demo.VirtualDom\Kolvir.Demo.VirtualDom.csproj -c Release -- --check

      # MSBuild and test diagnostics are not workflow annotations, so lift the failing test names
      # into the job summary: that is readable without downloading the artifact.
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Test diagnostics'
            echo '```'
            grep -E '^\s*(Failed|Error Message|Assert\.|Expected|Actual)' "$RUNNER_TEMP/test.log" | head -n 60 || true
            echo '```'
            echo '### Environment'
            echo '```'
            dotnet --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*Failed ' "$RUNNER_TEMP/test.log" | head -n 10 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      # The trx and the coverage report are the two things worth having after a red run, and the
      # artifact is uploaded only then: a green run's report is already in the log.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
