name: Tests

# All six suites are portable net10.0 assemblies, so they need no window server, no display and
# no platform workload: every test drives Kolvir through the headless backend, the animation suite
# drives its own clock and frame source rather than a real timer, and the image suites drive their
# timelines with a hand-advanced TimeProvider. That is why no leg of this
# workflow installs a workload - the packaging workflow is the only job that does, because it packs
# the net10.0-macos target. The matrix is the point rather than
# a formality - the same tests run on all three platforms, which is what keeps the portable claims
# honest, and a control that only behaves on one of them fails here.
#
# It runs on a pull request against develop and on demand. Pushes are deliberately not a trigger:
# work in progress is built and tested locally,
# where a run takes seconds, so a runner spinning up on every push to a feature branch only adds
# latency. A merge to develop does not need a rebuild either - the pull request that produced it
# already ran the same tests. Use workflow_dispatch to verify a branch that has no pull request.

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/tests.yml'
      - 'Kolvir.Tests/**'
      - 'Kolvir/**'
      - 'Kolvir.Backend/**'
      - 'Kolvir.Backend.Headless/**'
      - 'Kolvir.Backend.Win32/**'
      - 'Kolvir.Backend.Win32.Tests/**'
      - 'Kolvir.Feature.*/**'
      - 'Kolvir.Demo.App/Fonts/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite is deterministic by construction - a hand-driven clock, one embedded font, no network -
  # so a rerun should not change the result, and a flaky run is a bug to fix rather than a retry.
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    # A platform that fails should not hide the other two: three results say whether a break is
    # portable or platform-specific.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restoring the test projects restores the library, the headless backend and the feature with
      # them. It is a separate step so a restore failure is distinguishable from a test failure in
      # the log. Each test project is restored on its own rather than the whole solution: the
      # solution lists every platform backend and the platform workloads they need, and a runner
      # has none of those workloads installed.
      #
      # The core suite is portable as it stands: Kolvir.Tests references the library and the
      # headless backend and, on purpose, not Kolvir.Backend, whose three-framework list would bring
      # the workload in with it. The feature suite needs one property to be equally portable.
      # Kolvir.Feature.DragDrop lists net10.0-windows;net10.0-macos;net10.0 unconditionally, because
      # a single `dotnet pack` needs all three at once, and restore follows every framework in the
      # reference graph rather than only the inner build the test project binds. A plain restore
      # therefore resolves the net10.0-macos inner build, finds Kolvir.Backend.AppKit behind it and
      # stops with NETSDK1147 on a machine with no workload. -p:TargetFramework=net10.0 pins restore
      # to the single inner build the tests actually run against - the same narrowing the feature
      # project's own comment recommends for local work. The plural -p:TargetFrameworks= does not
      # work as a switch, because it reaches the restore graph and not the referenced projects'
      # builds.
      - name: Restore
        run: |
          dotnet restore Kolvir.Tests/Kolvir.Tests.csproj --nologo
          dotnet restore Kolvir.Feature.DragDrop.Tests/Kolvir.Feature.DragDrop.Tests.csproj --nologo -p:TargetFramework=net10.0
          dotnet restore Kolvir.Feature.Animations.Tests/Kolvir.Feature.Animations.Tests.csproj --nologo -p:TargetFramework=net10.0
          dotnet restore Kolvir.Feature.Svg.Tests/Kolvir.Feature.Svg.Tests.csproj --nologo -p:TargetFramework=net10.0
          dotnet restore Kolvir.Feature.AnimatedGif.Tests/Kolvir.Feature.AnimatedGif.Tests.csproj --nologo -p:TargetFramework=net10.0
          dotnet restore Kolvir.Feature.AnimatedWebp.Tests/Kolvir.Feature.AnimatedWebp.Tests.csproj --nologo -p:TargetFramework=net10.0
          dotnet restore Kolvir.Feature.Badges.Tests/Kolvir.Feature.Badges.Tests.csproj --nologo -p:TargetFramework=net10.0
          dotnet restore Kolvir.Feature.WoffFonts.Tests/Kolvir.Feature.WoffFonts.Tests.csproj --nologo -p:TargetFramework=net10.0

      # The filter is the category contract: a test that can only run on one platform carries
      # Platform.Win32, Platform.AppKit or Platform.Gtk4 and the portable job skips it. Everything
      # the matrix runs is Core, Headless, Pixels or a feature's own category. Keep this expression
      # identical to the one in the README so a local run matches CI.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Tests/Kolvir.Tests.csproj --no-restore --nologo \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=tests.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --collect:"Kolvir Code Coverage" \
            --blame-hang-timeout 5m 2>&1 | tee "$RUNNER_TEMP/test.log"

      # The feature suite is a second assembly because a rung-3 feature is a package of its own: an
      # application that never calls AddDragDrop() ships none of it, so it gets its own tests rather
      # than a folder inside the core suite. It runs under the same category filter, so a
      # platform-only test opts out the same way there. `tee -a` keeps both runs in one log, which
      # is what the failure summary below reads.
      #
      # -p:TargetFramework=net10.0 repeats the narrowing the restore step applies, and it has to:
      # --no-restore builds the graph from the global properties it is given, and `dotnet test` on a
      # net10.0 project would otherwise walk into the feature's net10.0-macos inner build and ask
      # for the workload this job deliberately does not install.
      - name: Test the drag and drop feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Feature.DragDrop.Tests/Kolvir.Feature.DragDrop.Tests.csproj --no-restore --nologo \
            -p:TargetFramework=net10.0 \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=dragdrop.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The animations feature's suite, wired the same way and for the same reasons: its own
      # assembly, the same category filter, and the same -p:TargetFramework=net10.0 narrowing
      # because the feature lists all three frameworks unconditionally for `dotnet pack`. Every
      # animation in it is driven by a hand-advanced clock and a frame source the test fires, so
      # this leg is as deterministic as the other two and needs no display.
      - name: Test the animations feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Feature.Animations.Tests/Kolvir.Feature.Animations.Tests.csproj --no-restore --nologo \
            -p:TargetFramework=net10.0 \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=animations.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The SVG feature's suite. Same wiring again, and the same -p:TargetFramework=net10.0
      # narrowing: the feature lists all three frameworks unconditionally so that one `dotnet pack`
      # produces the package. Everything in it renders to an SKPicture offscreen and reads pixels
      # back, so no display is involved; the security cases (an external reference, a script, an
      # entity bomb) are documents that must be refused, which is as headless as a test gets.
      - name: Test the SVG feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Feature.Svg.Tests/Kolvir.Feature.Svg.Tests.csproj --no-restore --nologo \
            -p:TargetFramework=net10.0 \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=svg.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The animated GIF feature's suite. Same wiring, same narrowing. It decodes and composites
      # frames in memory and reads pixels back, and every position it asserts comes from a clock the
      # test advances by hand, so it needs no display and no timer of its own.
      - name: Test the animated GIF feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Feature.AnimatedGif.Tests/Kolvir.Feature.AnimatedGif.Tests.csproj --no-restore --nologo \
            -p:TargetFramework=net10.0 \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=gif.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The animated WebP feature's suite. Same wiring, same narrowing. It builds RIFF containers
      # and decodes their frames in memory, ignores the run-time clock entirely and reads pixels back,
      # so no display and no timer are involved.
      - name: Test the animated WebP feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Feature.AnimatedWebp.Tests/Kolvir.Feature.AnimatedWebp.Tests.csproj --no-restore --nologo \
            -p:TargetFramework=net10.0 \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=webp.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The app badge feature's portable half. Same wiring and same narrowing. It exercises the
      # resolution of Count, Text, IsDot and Urgent into one presentation, and the degradation an
      # unsupported presentation gets, so it needs neither a window nor a desktop.
      - name: Test the app badge feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Feature.Badges.Tests/Kolvir.Feature.Badges.Tests.csproj --no-restore --nologo \
            -p:TargetFramework=net10.0 \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=badges.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The WOFF feature's suite. Same wiring and same narrowing. It unwraps real WOFF and WOFF 2
      # files - IBM Plex Sans, OFL, the same release as the face the sample carries - and compares the
      # glyphs they draw with the glyphs the plain .ttf draws, pixel for pixel through Skia. That is
      # as headless as a test gets: no window, no display, and nothing the machine has installed can
      # affect the answer.
      - name: Test the WOFF feature
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Feature.WoffFonts.Tests/Kolvir.Feature.WoffFonts.Tests.csproj --no-restore --nologo \
            -p:TargetFramework=net10.0 \
            --filter "TestCategory!=Platform.Win32&TestCategory!=Platform.AppKit&TestCategory!=Platform.Gtk4" \
            --logger "trx;LogFileName=woff.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The Win32 backend's own suite targets net10.0-windows and exists only on the Windows leg.
      # It covers the internal GL fallback decision with a fake probe; the accelerated path itself
      # needs a real driver, which no hosted runner has, so that half is verified by hand and
      # documented in the README rather than asserted here.
      - name: Restore the Win32 backend tests
        if: runner.os == 'Windows'
        run: dotnet restore Kolvir.Backend.Win32.Tests/Kolvir.Backend.Win32.Tests.csproj --nologo

      - name: Test the Win32 backend
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Backend.Win32.Tests/Kolvir.Backend.Win32.Tests.csproj --no-restore --nologo \
            --logger "trx;LogFileName=win32.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # The badge feature's Windows half: the overlay icon is drawn with Skia and handed to the
      # shell as a GDI icon, so its geometry is asserted pixel by pixel and cannot be checked from
      # the portable suite. Windows only, like the backend suite above, and narrowed to the one
      # framework it uses for the reason the feature csproj gives: an unnarrowed restore evaluates
      # all three of the feature's frameworks and stops for the macOS workload this job never
      # installs. -p:KolvirBadgeFrameworks= rather than -p:TargetFramework=, because the latter
      # would also override Kolvir's own net10.0 and leave it restored for one framework and built
      # for another.
      - name: Restore the Windows badge tests
        if: runner.os == 'Windows'
        run: dotnet restore Kolvir.Feature.Badges.Tests.Windows/Kolvir.Feature.Badges.Tests.Windows.csproj --nologo -p:KolvirBadgeFrameworks=net10.0-windows

      - name: Test the Windows badge icon
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          dotnet test Kolvir.Feature.Badges.Tests.Windows/Kolvir.Feature.Badges.Tests.Windows.csproj --no-restore --nologo \
            -p:KolvirBadgeFrameworks=net10.0-windows \
            --logger "trx;LogFileName=badges-win32.trx" \
            --results-directory "$RUNNER_TEMP/test-results" \
            --blame-hang-timeout 5m 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # MSBuild and test diagnostics are not workflow annotations, so lift the failing test names
      # into the job summary: that is readable without downloading the artifact.
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Test diagnostics'
            echo '```'
            grep -E '^\s*(Failed|Error Message|Assert\.|Expected|Actual)' "$RUNNER_TEMP/test.log" | head -n 60 || true
            echo '```'
            echo '### Environment'
            echo '```'
            dotnet --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*Failed ' "$RUNNER_TEMP/test.log" | head -n 10 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      # The trx and the coverage report are the two things worth having after a red run, and the
      # artifact is uploaded only then: a green run's report is already in the log.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
