# The guide's navigation: one file, at the root of docs/.
#
# `title` is what the sidebar shows and `href` is the page, relative to docs/. A group has `items`
# instead of an `href`. `planned: true` marks a page the plan has named and this phase has not written
# yet: it is left out of the built navigation, and the build fails if the page exists (the marker was
# forgotten) or if an unplanned page does not (a page was dropped).
#
# `include: controls` expands the generated control reference, so the list of controls lives in the
# generator's map rather than being copied here.

